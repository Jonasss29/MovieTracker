name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc baseline low for the Linux release build
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      # Fetched from the official repo instead of a third-party setup action.
      # The pinned tag is checked out as a local "stable" branch; a detached
      # tag checkout makes Flutter report an unknown channel.
      - name: Install Flutter
        run: |
          dir="$RUNNER_TEMP/flutter"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/flutter/flutter.git
          git -C "$dir" fetch -q --depth 1 origin "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$dir" checkout -q -b stable "$FLUTTER_VERSION"
          if [ "$RUNNER_OS" = "Windows" ]; then cygpath -w "$dir/bin"; else echo "$dir/bin"; fi >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          flutter --disable-analytics
          dart --disable-analytics
          flutter config --no-analytics --no-cli-animations --no-enable-android --no-enable-web

      # flutter doctor exits 0 on warnings, so check its summary explicitly
      - name: Flutter doctor
        run: |
          flutter doctor -v | tee "$RUNNER_TEMP/doctor.txt"
          grep -q "No issues found!" "$RUNNER_TEMP/doctor.txt"
