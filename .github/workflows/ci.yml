name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc baseline low for the Linux release build
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      # Cloned from the official repo instead of a third-party setup action
      - name: Install Flutter
        run: |
          dir="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then cygpath -w "$dir/bin"; else echo "$dir/bin"; fi >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          flutter --disable-analytics
          dart --disable-analytics
          flutter config --no-analytics --no-cli-animations --no-enable-android --no-enable-web

      - name: Flutter doctor
        run: flutter doctor -v
